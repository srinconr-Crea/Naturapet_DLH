# NaturaPet — configuracion local del proyecto.
# Principal: GPT-6.1 Sol, esfuerzo medio.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

# Planner, developer y reviewer: un subagente ejecutandose por vez.
[agents]
enabled = true
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "low"

# MCP y permisos se heredan de la sesion; no se agregan servidores ni hooks.
# Los perfiles especificos se mantienen en .codex/agents/*.toml.
