name: databricks-cicd

on:
  push:
    branches:
      - develop
      - qa
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
      target_name: ${{ steps.resolve.outputs.target_name }}
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
    steps:
      - name: Resolve target from event
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH_NAME="${{ github.base_ref }}"
          else
            BRANCH_NAME="${GITHUB_REF_NAME}"
          fi

          case "$BRANCH_NAME" in
            develop)
              echo "environment_name=dev" >> "$GITHUB_OUTPUT"
              echo "target_name=dev" >> "$GITHUB_OUTPUT"
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              ;;
            qa)
              echo "environment_name=qa" >> "$GITHUB_OUTPUT"
              echo "target_name=qa" >> "$GITHUB_OUTPUT"
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "environment_name=prod" >> "$GITHUB_OUTPUT"
              echo "target_name=prod" >> "$GITHUB_OUTPUT"
              if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              else
                echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "Unsupported branch ${BRANCH_NAME}" >&2
              exit 1
              ;;
          esac

  validate:
    needs: resolve-target
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-target.outputs.environment_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run unit tests
        shell: bash
        run: python -m pytest tests

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Configure Databricks auth
        shell: bash
        run: |
          echo "DATABRICKS_HOST=${{ secrets.DATABRICKS_HOST }}" >> "$GITHUB_ENV"
          echo "DATABRICKS_CLIENT_ID=${{ secrets.DATABRICKS_CLIENT_ID }}" >> "$GITHUB_ENV"
          echo "DATABRICKS_AUTH_TYPE=github-oidc" >> "$GITHUB_ENV"

      - name: Validate bundle
        shell: bash
        run: databricks bundle validate --target "${{ needs.resolve-target.outputs.target_name }}"

  deploy:
    if: needs.resolve-target.outputs.should_deploy == 'true' && github.event_name != 'pull_request'
    needs:
      - resolve-target
      - validate
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-target.outputs.environment_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Configure Databricks auth
        shell: bash
        run: |
          echo "DATABRICKS_HOST=${{ secrets.DATABRICKS_HOST }}" >> "$GITHUB_ENV"
          echo "DATABRICKS_CLIENT_ID=${{ secrets.DATABRICKS_CLIENT_ID }}" >> "$GITHUB_ENV"
          echo "DATABRICKS_AUTH_TYPE=github-oidc" >> "$GITHUB_ENV"

      - name: Deploy bundle
        shell: bash
        run: databricks bundle deploy --target "${{ needs.resolve-target.outputs.target_name }}"
