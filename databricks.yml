bundle:
  name: Naturapet_DLH

include:
  - resources/**/*.yml

sync:
  include:
    - notebooks/**/*
    - src/**/*
    - conf/**/*
    - resources/**/*

variables:
  project_name:
    description: Nombre del bundle y del workspace path del proyecto
    default: Naturapet_DLH
  domain_name:
    description: Dominio de datos a desplegar
    default: comercial
  data_layer:
    description: Capa de datos a desplegar
    default: bronze
  data_year:
    description: Anio de particion configurado para las rutas base
    default: "2026"
  data_month:
    description: Mes de particion configurado para las rutas base
    default: "01"
  catalog_name:
    description: Catalogo UC por ambiente
  schema_name:
    description: Schema UC del dominio y capa
  storage_account:
    description: Cuenta ADLS Gen2
    default: demodldb
  storage_container:
    description: Contenedor ADLS del proyecto
    default: democodex
  external_base_path:
    description: Ruta base de tablas delta externas en ADLS
  raw_base_path:
    description: Ruta base de aterrizaje raw en ADLS
  historic_base_path:
    description: Ruta base del historico en ADLS
targets:
  dev:
    default: true
    workspace:
      host: https://adb-7405606739630987.7.azuredatabricks.net
      root_path: /Workspace/Naturapet_BI/${bundle.target}
    variables:
      catalog_name: naturapet_dev
      schema_name: ${var.domain_name}_${var.data_layer}
      external_base_path: abfss://${var.storage_container}@${var.storage_account}.dfs.core.windows.net/external/dev/${var.domain_name}/${var.data_layer}/${var.data_year}/${var.data_month}
      raw_base_path: abfss://${var.storage_container}@${var.storage_account}.dfs.core.windows.net/raw/dev/${var.domain_name}/${var.data_year}/${var.data_month}
      historic_base_path: abfss://${var.storage_container}@${var.storage_account}.dfs.core.windows.net/historic/${var.domain_name}/${var.data_year}/${var.data_month}

  qa:
    mode: production
    workspace:
      host: https://adb-7405606739630987.7.azuredatabricks.net
      root_path: /Workspace/Naturapet_BI/${bundle.target}
    variables:
      catalog_name: naturapet_qa
      schema_name: ${var.domain_name}_${var.data_layer}
      external_base_path: abfss://${var.storage_container}@${var.storage_account}.dfs.core.windows.net/external/qa/${var.domain_name}/${var.data_layer}/${var.data_year}/${var.data_month}
      raw_base_path: abfss://${var.storage_container}@${var.storage_account}.dfs.core.windows.net/raw/qa/${var.domain_name}/${var.data_year}/${var.data_month}
      historic_base_path: abfss://${var.storage_container}@${var.storage_account}.dfs.core.windows.net/historic/${var.domain_name}/${var.data_year}/${var.data_month}

  prod:
    mode: production
    workspace:
      host: https://adb-7405606739630987.7.azuredatabricks.net
      root_path: /Workspace/Naturapet_BI/${bundle.target}
    variables:
      catalog_name: naturapet_prod
      schema_name: ${var.domain_name}_${var.data_layer}
      external_base_path: abfss://${var.storage_container}@${var.storage_account}.dfs.core.windows.net/external/prod/${var.domain_name}/${var.data_layer}/${var.data_year}/${var.data_month}
      raw_base_path: abfss://${var.storage_container}@${var.storage_account}.dfs.core.windows.net/raw/prod/${var.domain_name}/${var.data_year}/${var.data_month}
      historic_base_path: abfss://${var.storage_container}@${var.storage_account}.dfs.core.windows.net/historic/${var.domain_name}/${var.data_year}/${var.data_month}
