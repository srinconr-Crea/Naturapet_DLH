resources:
  jobs:
    monthly_file_refresh:
      name: ${bundle.target}-${var.project_name}-monthly-file-refresh
      description: Orquestacion bronze de Naturapet para cargar archivos raw y archivarlos en historic
      max_concurrent_runs: 1
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: 0 0 6 1 * ?
        timezone_id: America/Bogota
        pause_status: UNPAUSED
      tasks:
        - task_key: shared_load_to_delta
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/shared/bronze/load_to_delta
            base_parameters:
              environment: ${bundle.target}
              catalog_name: ${var.catalog_name}
              storage_account: ${var.storage_account}
              storage_container: ${var.storage_container}
              data_year: ${var.data_year}
        - task_key: shared_archive_to_historic
          depends_on:
            - task_key: shared_load_to_delta
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/shared/bronze/archive_to_historic
            base_parameters:
              environment: ${bundle.target}
              catalog_name: ${var.catalog_name}
              storage_account: ${var.storage_account}
              storage_container: ${var.storage_container}
              data_year: ${var.data_year}
        - task_key: comercial_load_to_delta
          depends_on:
            - task_key: shared_archive_to_historic
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/comercial/bronze/load_to_delta
            base_parameters:
              environment: ${bundle.target}
              catalog_name: ${var.catalog_name}
              storage_account: ${var.storage_account}
              storage_container: ${var.storage_container}
              data_year: ${var.data_year}
