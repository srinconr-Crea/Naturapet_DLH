resources:
  jobs:
    monthly_silver_refresh:
      name: ${bundle.target}-${var.project_name}-monthly-silver-refresh
      description: Orquestacion silver de Naturapet para estandarizacion, nulos, normalizacion, derivaciones y calidad
      max_concurrent_runs: 1
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: 0 30 6 1 * ?
        timezone_id: America/Bogota
        pause_status: UNPAUSED
      tasks:
        - task_key: shared_01_schema_standardization
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/shared/silver/01_schema_standardization
            base_parameters:
              environment: ${bundle.target}
              catalog_name: ${var.catalog_name}
              storage_account: ${var.storage_account}
              storage_container: ${var.storage_container}
              data_year: ${var.data_year}
              domain_name: shared
        - task_key: shared_02_null_corrections
          depends_on:
            - task_key: shared_01_schema_standardization
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/shared/silver/02_null_corrections
            base_parameters:
              environment: ${bundle.target}
              catalog_name: ${var.catalog_name}
              storage_account: ${var.storage_account}
              storage_container: ${var.storage_container}
              data_year: ${var.data_year}
              domain_name: shared
        - task_key: shared_03_domain_normalization
          depends_on:
            - task_key: shared_02_null_corrections
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/shared/silver/03_domain_normalization
            base_parameters:
              environment: ${bundle.target}
              catalog_name: ${var.catalog_name}
              storage_account: ${var.storage_account}
              storage_container: ${var.storage_container}
              data_year: ${var.data_year}
              domain_name: shared
